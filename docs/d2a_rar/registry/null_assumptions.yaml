  - id: gong_zhang_paid_obs
    name: "Gong & Zhang, The Cost of Information (ICML 2026, PMLR v306 p36013) - paid-observation contextual bandits"
    role: baseline
    target_null: none
    target_null_detail: "Cost-aware regret objective; no hypothesis test. Free-budget threshold phase transition in the regret rate."
    filtration: "Adversarial game: filtration H_t generated by contexts, actions, observed losses and costs (paper Assumption 2.1). No null hypothesis."
    sampling_assumption: "Learner draws the observation set O_t with probabilities p_t(a) = min{1, sqrt(eta_t q_t(a)/c_t(a))} (Alg 1/6) or B/(|A|T) (Alg 4); losses importance-weighted by 1/p_t. Observations immediate. Port (COMMON_CONTRACT_PORT): label request with declared propensity, labels used at release."
    dependence_assumption: "Adversarial (no stochastic assumption) for Algs 1/4/6; Alg 3 needs realizability f* in F with conditional mean of the loss given the context (semi-adversarial)."
    label_delay_assumption: "None in the model (observations are immediate). The port handles delay by using labels at release; no guarantee transfers."
    guarantee_type: regret_bound
    guarantee_note: "Read from the PDF incl. appendix Algs 4-6 (WP1d). Thm 2.1: R(T) <= O((c|A| ln|Pi|)^{1/3} T^{2/3} + sqrt(T ln|Pi|)) for uniform cost; Thm 2.2 lower bound; Thm 3.1/3.2 free-budget phase transition at B0 ~ c^{-2/3}(|A| ln|Pi|)^{1/3} T^{2/3}. Regret bounds of the adversarial game only; they do not transfer to the contract (drift, delay, hard label cap, switch costs). Printed eta in Alg 2 line 2 appears inconsistent (see baselines/GONG_ZHANG.md)."
    output_type: [label_allocation]
    source: "https://proceedings.mlr.press/v306/gong26i.html; MANDATE.md Phase 1D. GV docs/gaver/40_PRIOR_ART_CHECK.md item 2 (SNIPPET). Repo adapter: SL scripts/promising_directions/sota/ (bench2.NULL_TESTED 'gong_zhang_paid_obs': none)."
