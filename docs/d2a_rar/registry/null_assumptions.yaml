  - id: drift2act_certificate
    name: "Drift2Act active risk certificate + gate (Lamaakal et al., arXiv:2603.08578)"
    role: baseline_primary_host
    target_null: absolute_risk
    target_null_detail: "Gate U_t(delta) <= tau on the CURRENT windowed risk R_t (MANDATE A2). Not a paired-difference null; compares one model's risk upper bound to a threshold. Abstract-level: 'anytime-valid upper bound on current risk'."
    filtration: "UNVERIFIED (not stated in any ShiftLab note; paper Sec 4 / App D must be read)"
    sampling_assumption: "UNVERIFIED. MANDATE A2 says the Hoeffding+summable-allocation radius assumes uniform random sampling from the window; ShiftLab must audit this and NOT assert validity under informative or adaptive selection."
    dependence_assumption: "UNVERIFIED. Radius rad(n,delta)=sqrt(log(pi^2 n^2/(6 delta))/(2n)) is a Hoeffding bound for bounded losses in [0,1] with a union over n; MANDATE says do NOT assert validity under serial dependence, informative selection or arbitrary delayed sampling."
    label_delay_assumption: "UNVERIFIED. Abstract says evaluation includes a synthetic stream with label delay; whether the certificate is stated for delayed labels is unknown."
    guarantee_type: anytime-valid
    guarantee_note: "ABSTRACT-level claim only (GV docs/gaver/40_PRIOR_ART_CHECK.md, item 1). Per MANDATE the allocation pi^2/6 n^-2 is a union bound over sample sizes for a FIXED window-mean target; whether the target moves with drift is UNVERIFIED."
    output_type: [certificate, gate]
    source: "arXiv:2603.08578 Secs 3-5, Alg 1 (App B), CS derivation (App D); MANDATE.md Phase 1A. Repo: no implementation, no author code located (SL docs/promising_directions/sota/SOTA_APPLICABILITY_REPORTS.md section 3)."
    source_verification: ABSTRACT
    valid_validity_metric: "absolute-risk violation: P(gate passes while true current-window risk R_t > tau) under the SAME sampling scheme the certificate assumes (uniform from window). Do NOT report conditional or marginal false promotion of a paired difference for this component."
    notes_for_agents: "d2a agent: label every run PAPER_RECONSTRUCTION unless author code is found. Workshop paper (CAO Workshop at ICLR 2026). Earlier ShiftLab work judged a two-frozen-model restriction to remove its low-cost action ladder; do not invent retraining benefits or handoff outcomes."

