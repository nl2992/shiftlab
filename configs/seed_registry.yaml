# Seed registry (task T0.1). Checked by tests/test_seed_registry.py; do not edit overlaps silently.
version: 1
description: Registry of every seed range used by experiments. start/end are inclusive stream seed ids.
status_vocabulary: {development: tuning or exploratory development runs, calibration: null or bound calibration runs, confirmation: 'registered confirmation, replication or verification runs', exploratory: status could not be inferred from the study name, smoke: 'integrity or runtime smoke runs, excluded from inference', replay: deliberate replay of an earlier block, reserved_unused: registered in a protocol but no run found; do not reuse}
limitations: [Intervals are the declared base block seed_offset..seed_offset+n-1 (or an explicit interval/end field in the manifest). Streams derived with strides inside a runner (e.g. seed_offset + scenario_index * 107003) are not expanded., 'status for manifest-derived entries is inferred from the output directory name, not from a protocol; treat it as a hint.', Entries of the same interval used by several output directories are merged; see used_by., 'Where a manifest records only a start offset, the count came from a streams/replicates/attempts field or the output directory name (derivation field).', 'docs/gated_monitor_null_calibration_results.md:8 says S2 seeds are 58300000-58301999; the runner (scripts/run_gated_monitor_comparison.py:168) and protocol use 58500000-58501999. The registry records the actual range; the doc typo is left unedited.', 'Scalar dataset-split, encoder and bootstrap seeds are not stream blocks and are excluded; see excluded_scalar_seeds.']
