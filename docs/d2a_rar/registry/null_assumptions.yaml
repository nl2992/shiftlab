    notes_for_agents: "sota agent: native comparator where feasible plus a designated common-contract adaptation; label the adaptation COMMON_CONTRACT_PORT or CONCEPTUAL_PROXY."

  - id: asi_zrnic_candes
    name: "Active Statistical Inference (Zrnic & Candes, ICML 2024; arXiv:2403.03208)"
    role: baseline
    target_null: marg
    target_null_detail: "Estimand is a marginal population parameter (e.g. mean/risk E[Y]) with a confidence interval or test of that parameter; not a conditional-mean null on a filtration. Acquisition/inference comparator, not a controller (MANDATE E)."
    filtration: "Batch: i.i.d. points. Sequential: F_t = sigma((X_s, xi_s, Y_s xi_s), s <= t); f_t, pi_t must be F_{t-1}-measurable given X_t (Sec 6). Streaming COMMON_CONTRACT_PORT: filtration of released labels with propensity fixed at request time."
    sampling_assumption: "xi_t ~ Bern(pi_t(X_t)), pi_t > 0 known/logged, expected (not pathwise) budget n_b; sequential mixture tau=0.5 keeps pi_t >= tau n_b/n. Streaming port additionally needs pi_t >= pi_min and independence of xi_t from d_t given the past."
    dependence_assumption: "Batch: i.i.d. Sequential mean: martingale increments with common conditional mean; Prop 2 needs (1/n) sum sigma_t^2 -> sigma^2 in probability and Lindeberg (Ass. 2). Port: conditional-null E[d_t | past] <= h, losses in [0,1] (our one-sided extension of the WSR supermartingale; MC-validated only)."
    label_delay_assumption: "None in the paper (labels available when requested). Port consumes increments in round order at release; delay only slows evidence."
    guarantee_type: asymptotic
    guarantee_note: "Props 1-2, Thms 1-2: asymptotic normality and asymptotic coverage 1-alpha (read, App. A). App. C: for the mean with bounded increments and pi_t >= n_b/n * tau, betting CIs/CSs (WSR, Orabona-Jun) give non-asymptotic / time-uniform guarantees - stated briefly, no theorem of its own. The Wald CI is NOT anytime-valid. Streaming port = ASI-inspired COMMON_CONTRACT_PORT, claimed null cond with the stated assumptions."
    output_type: [estimate, label_allocation]
    source: "arXiv:2403.03208; PMLR v235 p62993; MANDATE.md Phase 1E; MAIN docs/failure_atlas_dss_positioning_v1.md section 2 (READ in an earlier repo audit)."
    source_verification: PAPER_FULLTEXT
    valid_validity_metric: "coverage of the marginal estimand under i.i.d. data and the stated sampling rule; efficiency (CI width) at fixed expected budget. Not a deployment false-promotion rate."
    wp1d_update: "2026-11-07 WP1d: fields filtration/sampling/guarantee/source_verification updated from the full text; see docs/d2a_rar/baselines."
    notes_for_agents: "Repo audit also records Xu, Karampatziakis, Mineiro arXiv 2406.10490 (active anytime-valid RCPS: iid, predictable randomized labelling q_t>=q_min, IPW e-process) as the closest anytime-valid acquisition analogue."

  - id: sethi_markov_test
    name: "Sethi et al., Asymptotically Optimal Sequential Testing with Markovian Data (ICML 2026; arXiv:2602.17587)"
    role: baseline
    target_null: marg
    target_null_detail: "Parametric null on the transition-matrix class: H0 in P vs H1 in Q for an ergodic finite-state Markov chain (abstract). A model/process-law null, not E[d_t | F_{t-1}] <= 0."
    filtration: "Natural filtration of the chain (X_0, ..., X_t), any initial law (Thm 4.1, Lemma B.6 in App. B.3/B.5)."
    sampling_assumption: "X_t observed at EVERY step (Alg 1 line 5). No irregular, missing or informatively chosen observation times in the model."
    dependence_assumption: "Ergodic finite-state Markov chain (abstract)"
    label_delay_assumption: "UNVERIFIED (not in the described model)"
    guarantee_type: anytime-valid
    guarantee_note: "Thm 4.1: P_P[tau < inf] <= alpha for every kernel P in the compact null and every initial law (time-uniform alpha-correctness via a mixture martingale, Lemma B.6); eps_t = log(1/alpha) + (m-1) sum_x log(e(1+N_x/(m-1))); Remark 4.2: exp(L_t - (m-1)beta_t) is bounded by a nonnegative supermartingale (e-process). Asymptotic optimality limsup_{alpha->0} E_Q[tau]/log(1/alpha) <= 1/D^M_inf (Thm 4.1), non-asymptotic lower bound Thm 3.3. No finite-alpha power claim; no loss/harm claim."
    output_type: [stopping_rule, alarm]
    source: "https://proceedings.mlr.press/v306/sethi26a.html; arXiv:2602.17587; MANDATE.md Phase 1F; GV docs/gaver/40_PRIOR_ART_CHECK.md item 3 (ABSTRACT)."
    source_verification: PAPER_FULLTEXT
    valid_validity_metric: "type-I error under H0 in P at the paper's stopping rule; expected stopping time under H1 in Q."
    wp1d_update: "2026-11-07 WP1d: fields filtration/sampling/guarantee/source_verification updated from the full text; see docs/d2a_rar/baselines."
    notes_for_agents: "sota agent: determine whether using P^{g_i} (exact-gap) is subsumed by existing theory; keep ShiftLab Markov-LR, restart and fixed-spacing comparators. Highest overlap threat to Gap-Mix (HIGH)."

