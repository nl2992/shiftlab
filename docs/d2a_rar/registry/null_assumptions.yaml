# Null-assumption registry (WP0, 2026-11-07). One entry per baseline / method in docs/d2a_rar/MANDATE.md.
#
# Notation: d_t = l(I(X_t),Y_t) - l(C(X_t),Y_t)  (incumbent loss minus challenger loss).
#   cond          H0cond : E[d_t | F_{t-1}] <= 0   (conditional on a stated filtration; ShiftLab 'V1')
#   marg          H0marg : E[d_t] <= 0             (stationary/exchangeable/parametric-process null; ShiftLab 'V2')
#   absolute_risk R_t <= tau (a risk-level requirement on ONE model; not a paired difference)
#   economic      expected deployment value after all costs (ShiftLab 'V3'); no anytime guarantee implied
#   none          the method claims no false-promotion/false-alarm guarantee (heuristic / regret / estimator)
#
# Rules for readers:
#  * Score each method's validity ONLY against its own target_null (valid_validity_metric). Reporting a marg
#    false-promotion rate for a cond method is the 'P2 error' (see failure_ledger.jsonl, rows with
#    null_mismatched=yes). Report such numbers only as labelled out-of-contract stress.
#  * Fields starting with 'UNVERIFIED' were NOT established by the WP0 agent. External papers were not read
#    by WP0; their entries rest on ShiftLab repo notes (abstract/snippet level) or on MANDATE.md and say so in
#    source_verification. The d2a / rar / sota agents must replace UNVERIFIED with paper-section citations.
#  * source_verification vocabulary: PAPER_FULLTEXT (not used by WP0), REPO_CODE (read module source),
#    REPO_DOC (read repo documents), ABSTRACT, SNIPPET, MANDATE_ONLY, NONE.
#  * 'guarantee_type' describes what the SOURCE claims, not what we verified.
#
# Branch refs used below (all read with git show; nothing checked out):
#   MAIN=main@7354480a  GV=origin/research/gave-r-2026-11-06@03289d1d  SL=origin/claude/sweet-lovelace-pznpjq@c53f6459
#   CO=research/continuation-2026-11-04@10a8e808  SC=origin/codex/scoped-method-research-results-2026-11-06@a9d5c3cd

