  # ------------------------------------------------------------------ ShiftLab methods and baselines
  - id: h2c
    name: "ShiftLab H2c / HG: Brier-guided cost-null betting e-process (prediction-powered, IPW control variate)"
    role: shiftlab_method
    target_null: cond
    target_null_detail: "COST null E[L_t | F_{t-1}] <= r0^C + tol (conditional excess decision cost); filtration = released labels. Brier increment only steers the stake."
    filtration: "released labels (event-order); predictable stake from history up to s-d-1"
    sampling_assumption: "Q_t ~ Bernoulli(q), independent of outcome, common random mask across arms; uniform (context-free) predictable cap Bd = hmax(1/q-1)+r0+tol"
    dependence_assumption: "None needed beyond the conditional mean bound; the ORIGINAL cap used the current proxy and broke validity under the marginal null (exact finite-support counterexample, E[factor] up to 1.13); repaired with a uniform cap."
    label_delay_assumption: "Fixed known delay d=5; the factor of step s enters wealth at s+d"
    guarantee_type: anytime-valid
    guarantee_note: "Ville on a nonnegative test martingale under the conditional null with predictable bets (docs/h2c_next/COST_NULL_VALIDITY.md cited by the anchor spec; not re-read by WP0). Nominal risk r0 is treated as KNOWN; estimating it removes power below ~5,000 calibration events (SL research/novelty_validation 11)."
    output_type: [alarm]
    source: "MAIN docs/hgxh2c/00_ANCHOR_SPEC.md section 1 (DOC-ONLY extraction of commit 60930a4); SL research/novelty_validation_2026-10-30/11_FAILURE_ANALYSIS.md."
    source_verification: REPO_DOC
    valid_validity_metric: "conditional: false-alarm rate under a stream whose conditional mean is at the boundary given F_{t-1}; the marginal-boundary Markov stream is a labelled out-of-contract stress."
    notes_for_agents: "Gas-stream reversal and MAG failure are in the ledger. Frozen G5 confirmation is synthetic within-class only."

