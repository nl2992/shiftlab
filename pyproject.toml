[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftlab"
version = "0.1.0"
description = "Reproducible starter benchmarks for three distribution-shift research tracks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "pydantic>=2.7", "pyyaml>=6", "pyarrow>=18", "requests>=2.32", "psutil>=6"]

[project.optional-dependencies]
wilds = ["wilds>=2.0", "torchvision==0.24.1"]
data-sources = ["folktables>=0.0.12"]
neural = ["torch==2.9.1"]
tracking = ["mlflow>=2.19"]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.13", "types-PyYAML", "pre-commit>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
shiftlab = "shiftlab.benchmark:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src/shiftlab/core"]
ignore_missing_imports = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
