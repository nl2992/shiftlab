[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftlab"
version = "0.1.0"
description = "Reproducible starter benchmarks for three distribution-shift research tracks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "pydantic>=2.7", "pyyaml>=6", "pyarrow>=18", "requests>=2.32", "psutil>=6", "tabulate>=0.9"]

[project.optional-dependencies]
wilds = ["wilds>=2.0", "torchvision==0.24.1"]
data-sources = ["folktables>=0.0.12"]
neural = ["torch==2.9.1"]
tracking = ["mlflow>=2.19"]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.13", "types-PyYAML", "pre-commit>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
shiftlab = "shiftlab.benchmark:main"
shiftlab-decision-harm = "shiftlab.decision_harm_experiment:main"
shiftlab-dive = "shiftlab.dive.experiment:main"
shiftlab-dive-promotion = "shiftlab.dive.promotion_experiment:main"
shiftlab-dive-promotion-grid = "shiftlab.dive.promotion_grid:main"
shiftlab-dive-promotion-timing = "shiftlab.dive.promotion_timing:main"
shiftlab-dive-persistence-grid = "shiftlab.dive.persistence_promotion:main"
shiftlab-dive-promotion-robustness = "shiftlab.dive.promotion_robustness:main"
shiftlab-dive-feature-intervention = "shiftlab.dive.feature_intervention:main"
shiftlab-dive-feature-intervention-grid = "shiftlab.dive.feature_intervention:sensitivity_main"
shiftlab-dive-feature-intervention-calibrate = "shiftlab.dive.feature_intervention_calibration:main"
shiftlab-dive-feature-intervention-confirm = "shiftlab.dive.feature_intervention_confirmation:main"
shiftlab-dive-budgeted-promotion = "shiftlab.dive.budgeted_promotion:main"
shiftlab-dive-grid = "shiftlab.dive.allocation_grid:main"
shiftlab-dive-robust-grid = "shiftlab.dive.allocation_grid:robust_main"
shiftlab-dive-hard-budget = "shiftlab.dive.hard_budget:main"
shiftlab-dive-delayed = "shiftlab.dive.delayed_benchmark:main"
shiftlab-dive-delayed-grid = "shiftlab.dive.delayed_grid:main"
shiftlab-dive-delayed-calibration = "shiftlab.dive.delayed_calibration:main"
shiftlab-dive-delayed-confirmation = "shiftlab.dive.delayed_confirmation:main"
shiftlab-dive-delayed-grid-confirmation = "shiftlab.dive.delayed_grid_confirmation:main"
shiftlab-dive-start-prior-sweep = "shiftlab.dive.start_prior_sweep:main"
shiftlab-dive-start-prior-validation = "shiftlab.dive.start_prior_validation:main"
shiftlab-dive-start-prior-robustness = "shiftlab.dive.start_prior_robustness:main"
shiftlab-dive-horizon-hedge-sweep = "shiftlab.dive.horizon_hedge_sweep:main"
shiftlab-dive-late-prior-confirmation = "shiftlab.dive.late_prior_confirmation:main"
shiftlab-dive-start-prior-robust-mix = "shiftlab.dive.start_prior_robust_mix:main"
shiftlab-dive-proxy-hedge = "shiftlab.dive.proxy_hedge_benchmark:main"
shiftlab-dive-risk-proxy-stress = "shiftlab.dive.risk_proxy_stress_grid:main"
shiftlab-dive-risk-proxy-stress-analyze = "shiftlab.dive.analyze_risk_proxy_stress_grid:main"
shiftlab-dive-risk-proxy-monitor-grid = "shiftlab.dive.risk_proxy_monitor_grid:main"
shiftlab-dive-risk-proxy-monitor-confirm = "shiftlab.dive.risk_proxy_monitor_confirmation:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src/shiftlab/core"]
ignore_missing_imports = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
